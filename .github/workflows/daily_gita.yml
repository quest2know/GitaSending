name: Daily Gita Dispatch

on:
  schedule:
    # Runs at 00:30 UTC every day (06:00 AM IST) 
    - cron: '30 15 * * *'
  workflow_dispatch: # Allows you to run it manually from the GitHub Actions tab for testing

permissions:
  contents: write # Needed to commit state.json back to the repo

jobs:
  dispatch_gita:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup Environment Variables
        run: |
          echo "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}" >> .env
          echo "DRIVE_FOLDER_ID=${{ secrets.DRIVE_FOLDER_ID }}" >> .env
          echo "GOOGLE_CREDENTIALS_JSON=${{ secrets.GOOGLE_CREDENTIALS_JSON }}" >> .env

      - name: Run Gita Sending Script
        run: python send_today.py

      - name: Commit Updated State
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          # Only commit and push if state.json actually changed (i.e. a file was sent)
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update state.json to next file index [skip ci]" && git push)
